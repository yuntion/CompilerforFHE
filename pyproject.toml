[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfhe-front"
version = "0.1.0"
description = "PyTorch/ONNX frontend and driver for the CrossFHE MLIR compiler"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "onnx>=1.16,<2"]

[project.optional-dependencies]
torch = ["torch>=2.4,<3"]
dev = ["pytest>=8,<9", "cmake>=3.24,<4", "ninja>=1.11"]

[project.scripts]
crossfhe = "crossfhe.cli:main"

[tool.setuptools]
packages = ["crossfhe", "backend", "backend.ai"]
package-dir = {crossfhe = "front/crossfhe", backend = "backend"}

[tool.setuptools.package-data]
backend = ["api/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/front", "tests/compiler", "tests/backend", "tests/e2e"]
pythonpath = ["front", "."]
addopts = "--strict-markers"
markers = [
    "fhe: real native compilation and encrypted execution",
    "gpu: requires the optional Phantom CUDA backend",
    "native: requires the native CrossFHE compiler tools",
    "torch: requires PyTorch export or reference execution",
    "seal: requires the SEAL CKKS backend",
    "openfhe: requires the OpenFHE cross-scheme backend",
]
